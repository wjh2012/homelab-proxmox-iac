---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - qemu-guest-agent
      - curl
      - vim
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure QEMU Guest Agent is running
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
